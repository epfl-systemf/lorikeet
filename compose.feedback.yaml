name: lorikeet-feedback

services:
  feedback:
    build:
      context: ./feedback_website
    restart: unless-stopped
    ports:
      - "127.0.0.1:8765:8765"
    environment:
      LORIKEET_PUBLIC_ORIGIN: https://cs-214.epfl.ch
      LORIKEET_LOG_DIR: /var/lib/lorikeet-feedback
    volumes:
      - feedback-logs:/var/lib/lorikeet-feedback
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8765/', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  feedback-logs:
    name: lorikeet-feedback-logs
