<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lorikeet feedback</title>
<style>
:root{
  --ink:#17201c;--muted:#68736d;--page:#f3f5f1;--surface:#fff;
  --line:#dce2dd;--accent:#275f4b;--accent-soft:#e8f3ed;
  --code:#18201d;--code-ink:#edf5ef;--add:#e2f3e8;--remove:#fae7e3;
  --danger:#a23f32;--shadow:0 18px 45px rgba(24,32,29,.08);
  --sans:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--sans);line-height:1.55}
button{font:inherit}
.shell{width:min(1180px,calc(100% - 40px));margin:0 auto;padding:52px 0 80px}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;gap:40px;margin-bottom:32px}
.page-header h1{margin:4px 0 8px;font-size:clamp(2.1rem,5vw,4.25rem);line-height:1;letter-spacing:-.055em}
.page-header p{max-width:650px;margin:0;color:var(--muted)}
.eyebrow{color:var(--accent);font-size:.72rem;font-weight:800;letter-spacing:.13em;text-transform:uppercase}
.run-label{display:grid;gap:3px;min-width:180px;padding:13px 16px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.65);font:700 .78rem var(--mono)}
.run-label span{color:var(--muted);font-weight:400}
.timeline{margin-bottom:32px;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden}
.timeline-heading{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:22px 24px;border-bottom:1px solid var(--line)}
.timeline-heading h2,.history h3{margin:2px 0 0;font-size:1.22rem}
.location{color:var(--muted);font:11px/1.45 var(--mono);overflow-wrap:anywhere}
.timeline-heading .location{display:block;margin-top:3px}
.step-count{flex:none;padding:6px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.75rem;font-weight:750}
.workspace{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(280px,.75fr);min-height:430px}
.code-panel{min-width:0;background:var(--code);color:var(--code-ink)}
.code-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid #34413b;color:#9fb0a7;font:11px var(--mono)}
.context-tools{display:flex;align-items:center;justify-content:flex-end;gap:12px}
.code-view{height:430px;overflow:auto;font:13px/1.72 var(--mono);tab-size:2}
.code-table{width:max-content;min-width:100%;border-collapse:collapse;table-layout:auto}
.code-row td{height:22px;vertical-align:top}.change-gutter{width:5px;padding:0;border-left:4px solid transparent}.focus-line .change-gutter{border-left-color:#f5c84b;animation:gutter-pulse 1.5s ease-in-out}.line-number{width:48px;padding:0 10px;color:#708077;background:#151c19;border-right:1px solid #303b36;text-align:right;user-select:none}.code-line{min-width:600px;padding:0 16px;white-space:pre}.code-line code{font:inherit;color:inherit;text-shadow:none}
.context-gap td{padding:0;border-block:1px solid #34413b;background:#202a26}.context-gap button{width:100%;border-radius:0;padding:7px 14px;background:transparent;color:#9fc7b7;font:11px var(--mono);text-align:left}.context-gap button:hover{background:#2b3933;color:#d9e7df}
@keyframes gutter-pulse{50%{border-left-color:#ffe486}}
.change-card{padding:24px;border-left:1px solid var(--line);background:#fcfdfb}
.change-card h3{margin:5px 0 3px;font-size:1.25rem;line-height:1.25}
.change-card p{font-size:.88rem;color:#46504b}
.change-card .original-copy{margin-top:28px;color:var(--muted)}
.timeline-nav{display:grid;grid-template-columns:auto minmax(180px,1fr) auto;align-items:center;gap:18px;padding:16px 20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
button{border:0;border-radius:9px;padding:9px 14px;background:var(--accent);color:white;font-size:.82rem;font-weight:750;cursor:pointer}
button.secondary{border:1px solid var(--line);background:white;color:var(--ink)}
button:disabled{opacity:.42;cursor:not-allowed}
button:focus-visible{outline:3px solid rgba(39,95,75,.3);outline-offset:2px}
.progress-wrap{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}
progress{width:100%;height:8px;border:0;border-radius:99px;overflow:hidden;background:#e7ebe8}
progress::-webkit-progress-bar{background:#e7ebe8}progress::-webkit-progress-value{background:var(--accent)}progress::-moz-progress-bar{background:var(--accent)}
.progress-wrap span{min-width:36px;color:var(--muted);font:11px var(--mono);text-align:right}
.history{padding:22px 24px 26px}.history-title{margin-bottom:14px}.history ol{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.history details{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:white}
.history details.current{border-color:#8cb5a5;box-shadow:0 0 0 2px var(--accent-soft)}
.history summary{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;list-style:none}
.history summary::-webkit-details-marker{display:none}.commit-dot{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:700 11px var(--mono)}
.commit-title{font-size:.84rem;font-weight:750}.commit-location{color:var(--muted);font:10px var(--mono)}
.diff-table{width:100%;border-collapse:collapse;border-top:1px solid var(--line);font:12px/1.55 var(--mono)}
.diff-table td{padding:2px 10px;white-space:pre-wrap;overflow-wrap:anywhere}.diff-table td:first-child{width:25px;padding-right:0;color:var(--muted);user-select:none}
.diff-table tr.remove{background:var(--remove);color:#722b23}.diff-table tr.add{background:var(--add);color:#174f34}
.observation-note{padding:12px 14px;border-top:1px solid var(--line);background:#f7faf8;color:var(--muted);font-size:.82rem}
.rating{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:24px}.rating span{margin-right:3px;color:var(--muted);font-size:.75rem}
.rating button{padding:6px 10px;border:1px solid var(--line);background:white;color:var(--ink);font-size:.75rem}.rating button.selected{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.empty-state,.limit-warning{padding:28px;border:1px solid var(--line);border-radius:14px;background:white}.empty-state h2{margin-top:0}.empty-state p{margin-bottom:0;color:var(--muted)}
.limit-warning{margin:0 24px 24px;border-color:#edc3ba;background:#fff5f2;color:var(--danger);font-size:.85rem}
.token.comment,.token.prolog,.token.doctype,.token.cdata{color:#819087}.token.punctuation{color:#b7c2bc}.token.namespace{opacity:.75}.token.property,.token.tag,.token.constant,.token.symbol,.token.deleted{color:#ff9685}.token.boolean,.token.number{color:#e6bd7a}.token.selector,.token.attr-name,.token.string,.token.char,.token.builtin,.token.inserted{color:#a8d7a9}.token.operator,.token.entity,.token.url{color:#d7dfda}.token.atrule,.token.attr-value,.token.keyword{color:#82bde9}.token.function,.token.class-name{color:#e6a5d2}.token.regex,.token.important,.token.variable{color:#f0cd72}
@media(max-width:850px){.workspace{grid-template-columns:1fr}.change-card{border-left:0;border-top:1px solid var(--line)}.page-header{align-items:flex-start;flex-direction:column}.run-label{width:100%}}
@media(max-width:560px){.shell{width:min(100% - 20px,1180px);padding-top:26px}.timeline-heading,.history{padding-inline:15px}.timeline-nav{grid-template-columns:1fr 1fr}.progress-wrap{grid-column:1/-1;grid-row:1}.code-view{height:360px;font-size:11.5px}.code-line{min-width:480px}.history summary{grid-template-columns:30px 1fr}.commit-location{display:none}}
@media(prefers-reduced-motion:reduce){.focus-line .change-gutter{animation:none}}
</style>
</head>
<body>
<main class="shell"></main>
<script>
document.addEventListener("DOMContentLoaded",()=>{
  const INITIAL_CONTEXT_LINES=5,CONTEXT_INCREMENT=5,HIGHLIGHT_MS=1500;
  const payload=JSON.parse(document.getElementById("timeline-data").textContent);
  const escapeHtml=value=>String(value??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;");
  const highlight=value=>window.Prism?.languages?.scala?Prism.highlight(value,Prism.languages.scala,"scala"):escapeHtml(value);
  const rating=()=>`<div class="rating"><span>Was this feedback helpful?</span><button type="button" data-rating="positive">Yes</button><button type="button" data-rating="negative">No</button></div>`;
  const diffRows=step=>{
    if(step.kind==="observation")return `<div class="observation-note">Observation only — the code is unchanged.</div>`;
    const rows=[];
    step.before.split("\n").forEach(line=>rows.push(`<tr class="remove"><td>−</td><td>${escapeHtml(line)||" "}</td></tr>`));
    step.after.split("\n").forEach(line=>rows.push(`<tr class="add"><td>+</td><td>${escapeHtml(line)||" "}</td></tr>`));
    return `<table class="diff-table"><tbody>${rows.join("")}</tbody></table>`;
  };
  document.querySelectorAll(".timeline").forEach(timeline=>{
    const history=payload.histories[Number(timeline.dataset.historyIndex)];
    const code=timeline.querySelector("[data-code]");
    const codeView=code.closest(".code-view");
    const card=timeline.querySelector("[data-change-card]");
    const back=timeline.querySelector("[data-back]");
    const forward=timeline.querySelector("[data-forward]");
    const progress=timeline.querySelector("[data-progress]");
    const historyPanel=timeline.querySelector("[data-history]");
    const list=timeline.querySelector("[data-history-list]");
    const contextLabel=timeline.querySelector("[data-context-label]");
    let current=0,busy=false,beforeContext=INITIAL_CONTEXT_LINES,afterContext=INITIAL_CONTEXT_LINES;
    function resetContext(){beforeContext=INITIAL_CONTEXT_LINES;afterContext=INITIAL_CONTEXT_LINES}
    function currentCode(){return current?history.steps[current-1].code:history.initial}
    function currentRange(){
      const step=current?history.steps[current-1]:history.steps[0];
      if(!step)return {start:0,end:0};
      return current&&step.kind==="rewrite"?{start:step.start,end:step.start+step.after.length}:{start:step.start,end:step.end};
    }
    function codeWindow(value,range){
      const starts=[0];
      for(let index=0;index<value.length;index++)if(value[index]==="\n")starts.push(index+1);
      const lineAt=offset=>{let line=0;while(line+1<starts.length&&starts[line+1]<=offset)line++;return line};
      const targetStart=lineAt(range.start),targetEnd=lineAt(Math.max(range.start,range.end-1));
      const first=Math.max(0,targetStart-beforeContext),last=Math.min(starts.length-1,targetEnd+afterContext);
      return {first,last,targetStart,targetEnd,total:starts.length,full:first===0&&last===starts.length-1};
    }
    function renderCode(value,window,focus,forceFocus){
      const previousTop=codeView.scrollTop,previousLeft=codeView.scrollLeft;
      const lines=value.split("\n"),rows=[];
      const gap=(direction,count)=>`<tr class="context-gap"><td colspan="3"><button type="button" data-expand-${direction} ${busy?"disabled":""}>${direction==="before"?"↑":"↓"} Show ${count} more line${count===1?"":"s"}</button></td></tr>`;
      if(window.first)rows.push(gap("before",Math.min(CONTEXT_INCREMENT,window.first)));
      for(let index=window.first;index<=window.last;index++){
        const focused=focus&&index>=window.targetStart&&index<=window.targetEnd;
        rows.push(`<tr class="code-row${focused?" focus-line":""}" ${index===window.targetStart?"data-target-line":""}><td class="change-gutter" aria-hidden="true"></td><td class="line-number" aria-hidden="true">${index+1}</td><td class="code-line"><code class="language-scala">${highlight(lines[index])||"&#8203;"}</code></td></tr>`);
      }
      if(window.last<window.total-1)rows.push(gap("after",Math.min(CONTEXT_INCREMENT,window.total-window.last-1)));
      code.innerHTML=rows.join("");
      if(forceFocus){
        const target=code.querySelector(".focus-line,[data-target-line]");
        codeView.scrollTop=Math.max(0,target.offsetTop-codeView.clientHeight/2);
        codeView.scrollLeft=0;
      }else{
        codeView.scrollTop=previousTop;
        codeView.scrollLeft=previousLeft;
      }
      contextLabel.textContent=window.full?`Full file · ${window.total} lines`:`Lines ${window.first+1}–${window.last+1} of ${window.total}`;
    }
    function renderHistory(){
      const entries=history.steps.slice(0,current).map((step,index)=>({step,index})).reverse();
      historyPanel.hidden=!entries.length;
      list.innerHTML=entries.map(({step,index},position)=>`<li><details class="${position?"":"current"}" data-history-step="${index}" ${position?"":"open"}><summary><span class="commit-dot">${index+1}</span><span><span class="commit-title">${escapeHtml(step.title)}</span><br><span class="commit-location">${step.kind==="observation"?"Observation · ":"Rewrite · "}line ${step.line}:${step.column}</span></span><span aria-hidden="true">⌄</span></summary>${diffRows(step)}</details></li>`).join("");
    }
    function render(focus=null,forceFocus=false){
      const value=currentCode();
      const step=current?history.steps[current-1]:null;
      const ordinal=step?history.steps.slice(0,current).filter(item=>item.kind===step.kind).length:0;
      const range=focus||currentRange(),window=codeWindow(value,range);
      if(!focus&&step?.kind==="observation")focus=range;
      renderCode(value,window,focus,forceFocus);
      timeline.querySelector("[data-version-label]").textContent=step?.kind==="observation"?`Final code · observation ${ordinal}`:step?`After rewrite ${ordinal}`:"Original";
      timeline.querySelector("[data-step-count]").textContent=`${current} / ${history.steps.length}`;
      timeline.querySelector("[data-progress-label]").textContent=`${current}/${history.steps.length}`;
      progress.value=current;
      back.disabled=busy||current===0;
      forward.disabled=busy||current===history.steps.length;
      forward.textContent=current===history.steps.length?"Complete":"Next feedback →";
      card.dataset.feedbackId=step?.id||"";
      card.innerHTML=step?`<span class="eyebrow">${step.kind==="observation"?"Observation":"Rewrite"} ${ordinal}</span><h3>${escapeHtml(step.title)}</h3><span class="location">${escapeHtml(step.location)}</span>${step.explanation?`<p>${escapeHtml(step.explanation)}</p>`:""}${rating()}`:`<span class="eyebrow">Starting point</span><h3>Original submission</h3><p class="original-copy">Use Next feedback to step through each rewrite and then review observations on the final code.</p>`;
      renderHistory();
    }
    forward.addEventListener("click",async()=>{
      if(busy||current===history.steps.length)return;
      const step=history.steps[current];
      resetContext();
      if(step.kind==="observation"){
        current++;render(null,true);
        timeline.dispatchEvent(new CustomEvent("timelinechange",{bubbles:true,detail:{id:step.id}}));
        return;
      }
      busy=true;render({start:step.start,end:step.end},true);
      await new Promise(resolve=>setTimeout(resolve,HIGHLIGHT_MS));
      current++;busy=false;render(null,true);
      timeline.dispatchEvent(new CustomEvent("timelinechange",{bubbles:true,detail:{id:step.id}}));
    });
    back.addEventListener("click",()=>{if(busy||current===0)return;current--;resetContext();render(null,true);if(current){timeline.dispatchEvent(new CustomEvent("timelinechange",{bubbles:true,detail:{id:history.steps[current-1].id}}))}});
    codeView.addEventListener("click",event=>{
      const button=event.target.closest("[data-expand-before],[data-expand-after]");
      if(!button||busy)return;
      if(button.hasAttribute("data-expand-before"))beforeContext+=CONTEXT_INCREMENT;
      else afterContext+=CONTEXT_INCREMENT;
      render();
    });
    timeline.addEventListener("keydown",event=>{if(event.key==="ArrowRight")forward.click();if(event.key==="ArrowLeft")back.click()});
    render();
  });
});
</script>
</body>
</html>
