# Include inside the existing HTTPS server block for cs-214.epfl.ch.
# Keep existing TLS and any course authentication configuration.
location = /lorikeet-feedback {
    return 308 /lorikeet-feedback/;
}

location ^~ /lorikeet-feedback/ {
    # The trailing slash strips the public prefix before forwarding.
    proxy_pass http://127.0.0.1:8765/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 32k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
}
