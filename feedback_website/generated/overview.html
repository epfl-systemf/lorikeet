<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overview</title>
<style>
:root{
  --bg:#f6f7f9;
  --panel:#ffffff;
  --line:#e5e7eb;
  --text:#202124;
  --muted:#6b7280;
  --accent:#5b5bd6;
  --accent-soft:#f2f1ff;
  --codebg:#fbfbfc;
  --issue:#fff7ed;
  --issue-border:#fdba74;
  --green:#166534;
  --green-bg:#f0fdf4;
  --red:#b42318;
  --red-bg:#fff1f0;
}
*{box-sizing:border-box}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
.shell{
  max-width:1160px;
  margin:0 auto;
  padding:36px 24px 60px;
}
.header{
  margin-bottom:18px;
}
.header h1{
  margin:0 0 6px;
  font-size:28px;
  letter-spacing:-.02em;
}
.header .file{
  color:var(--muted);
  font:13px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}
.layout{
  display:grid;
  grid-template-columns:minmax(0,1.35fr) minmax(330px,.85fr);
  gap:18px;
  align-items:start;
}
.panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
}
.panel-title{
  padding:14px 16px;
  border-bottom:1px solid var(--line);
  font-size:13px;
  font-weight:700;
}
.code{
  background:var(--codebg);
  padding:12px 0;
  font:13.5px/1.8 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}
.code-line{
  display:grid;
  grid-template-columns:14px 30px 1fr;
  min-height:28px;
  align-items:center;
  padding-right:14px;
}
.code-line.issue{
  background:var(--issue);
  cursor:pointer;
}
.ln{
  color:#9ca3af;
  text-align:right;
  padding-right:10px;
  user-select:none;
}
.marker{
  width:10px;
  height:10px;
  display:inline-block;
  position:relative;
  cursor:pointer;
}
.marker::before{
  content:"";
  position:absolute;
  left:1px;
  top:1px;
  width:8px;
  height:8px;
  background:#f59e0b;
  border-radius:2px 2px 50% 2px;
  transform:rotate(45deg);
}
.marker::after{
  content:"";
  position:absolute;
  left:4px;
  top:2px;
  width:2px;
  height:5px;
  background:white;
  border-radius:1px;
}
.marker:hover,.marker.active{
  background:#ffedd5;
}
.code-text{
  white-space:pre;
}
.hint{
  padding:12px 16px;
  border-top:1px solid var(--line);
  color:var(--muted);
  font-size:12px;
}
.feedback-panel{
  min-height:280px;
}
.empty{
  padding:52px 28px;
  text-align:center;
  color:var(--muted);
  font-size:14px;
  line-height:1.5;
}
.feedback{
  display:none;
}
.feedback.active{
  display:block;
}
.feedback-head{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:14px;
  padding:17px 18px 14px;
  border-bottom:1px solid var(--line);
}
.feedback-title{
  font-weight:750;
  font-size:16px;
}
.location{
  margin-top:5px;
  color:var(--muted);
  font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}
.close{
  border:none;
  background:transparent;
  color:#6b7280;
  cursor:pointer;
  font-size:19px;
  line-height:1;
}
.feedback-body{
  padding:18px;
}
.feedback-subtitle{
  margin:0 0 8px;
  font-size:13px;
  font-weight:700;
}
.feedback-help{
  margin:0 0 12px;
  color:var(--muted);
  font-size:13px;
  line-height:1.55;
}
.message{
  margin:0 0 14px;
  font-size:14px;
  line-height:1.55;
}
pre{
  margin:0;
  padding:13px 14px;
  background:#fafafa;
  border:1px solid var(--line);
  border-radius:10px;
  overflow:auto;
  font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}
.rewrite-result{
  margin:0;
  padding:0 14px;
  min-height:28px;
  background:var(--green-bg);
  border:none;
  border-radius:0;
  color:var(--green);
  font:13.5px/28px ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}
.diff{
  margin-top:14px;
  display:grid;
  gap:8px;
}
.diff-row{
  border-radius:9px;
  padding:10px 12px;
  font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
}
.minus{background:var(--red-bg);color:var(--red)}
.plus{background:var(--green-bg);color:var(--green)}
.rating{
  margin-top:18px;
  display:flex;
  align-items:center;
  justify-content:flex-end;
  gap:8px;
  flex-wrap:wrap;
}
.rating-label{
  color:var(--muted);
  font-size:13px;
  margin-right:2px;
}
.rate{
  border:1px solid var(--line);
  background:white;
  border-radius:9px;
  padding:7px 10px;
  font-size:13px;
  color:#374151;
  cursor:pointer;
  display:inline-flex;
  align-items:center;
  gap:6px;
}
.rate svg{width:15px;height:15px}
.rate.selected-positive{
  background:#ecfdf3;
  border-color:#bbf7d0;
  color:#166534;
}
.rate.selected-negative{
  background:#fff1f0;
  border-color:#fecaca;
  color:#b42318;
}
@media(max-width:820px){
  .layout{grid-template-columns:1fr}
}
</style>
<style>table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:600}tbody tr:last-child td{border-bottom:0}a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}</style></head>

</body>
</html>
