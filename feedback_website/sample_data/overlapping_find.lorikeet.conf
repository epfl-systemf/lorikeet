max-rewrites = 40

rules = [
  {
    name = "Negated Boolean If"
    description = "if c then false else true  ==>  !c"
    pattern = """if `?condition` then false else true"""
    rewrite = """!`?condition`"""
  }
  {
    name = "False Else Branch"
    description = "if c then e else false  ==>  c && e"
    pattern = """if `?condition` then `?expression` else false"""
    rewrite = """`?condition` && `?expression`"""
  }
  {
    name = "Equals Method"
    description = "Use Scala's null-safe == operator instead of .equals"
    pattern = """`?left`.equals(`?right`)"""
    rewrite = """`?left` == `?right`"""
  }
  {
    name = "Nested Side-effecting If"
    description = "Combine nested conditions that guard the same side effect"
    pattern = """
      if `?outer` then
        if `?inner` then
          `?body`
    """
    rewrite = """
      if `?outer` && `?inner` then
        `?body`
    """
  }
  {
    name = "Var Usage"
    description = "Use vals and recursion instead of mutable state"
    pattern = """var `?name`: `?` = `?initial`"""
  }
  {
    name = "Var Usage"
    description = "Use vals and recursion instead of mutable state"
    pattern = """var `?name` = `?initial`"""
  }
  {
    name = "Early Return"
    description = "An early return makes this recursive search harder to compose"
    pattern = """return true"""
  }
  {
    name = "Return In Return Position"
    description = "The final expression is returned without an explicit return"
    pattern = """return `?value`"""
  }
  {
    name = "While Loop"
    description = "Use recursion for sibling traversal in this exercise"
    pattern = """
      while `?condition` do
        `?body`
    """
  }
  {
    name = "Unexpected Import"
    description = "Remove imports that are not needed by the solution"
    pattern = """import scala.util.Random"""
  }
  {
    name = "Uppercase Parameter Name"
    description = "Name parameters with lowerCamelCase"
    match-fqn = false
    pattern = """def helperParcours(`?F`: Entry => Boolean, `?E`: Entry): Boolean = `?body`"""
  }
  {
    name = "Higher-order Function Too Early"
    description = "This exercise introduces direct recursion before higher-order functions"
    match-fqn = false
    pattern = """def applyPredicate(`?function`: Entry => Boolean, `?entry`: Entry): Boolean = `?body`"""
  }
]

token-rules = [
  {
    name = "Semicolon Usage"
    description = "Semicolons at the end of a line are unnecessary in Scala"
    pattern = """;(?=[ \t]*(?://[^\r\n]*)?(?:\r?\n|$))"""
    rewrite = ""
  }
]
