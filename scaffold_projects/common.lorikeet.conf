max-rewrites = 200

rules = [
  # Braces preserve grouping when an operator call appears inside a larger expression.
  {
    name = "Infix +"
    description = "Write + between its operands."
    pattern = """`?left`.+(`?right`)"""
    rewrite = """{ `?left` + `?right` }"""
  }
  {
    name = "Infix -"
    description = "Write - between its operands."
    pattern = """`?left`.-(`?right`)"""
    rewrite = """{ `?left` - `?right` }"""
  }
  {
    name = "Infix *"
    description = "Write * between its operands."
    pattern = """`?left`.*(`?right`)"""
    rewrite = """{ `?left` * `?right` }"""
  }
  {
    name = "Infix /"
    description = "Write / between its operands."
    pattern = """`?left`./(`?right`)"""
    rewrite = """{ `?left` / `?right` }"""
  }
  {
    name = "Evaluate before true"
    description = "The result of x || true is always true, but x may print or recurse. Evaluate x first, then finish with true."
    pattern = """
      def `?function`(@mult `?args`: `?argTypes`): `?resultType` =
        `?expression` || true
    """
    rewrite = """
      def `?function`(@mult `?args`: `?argTypes`): `?resultType` =
        `?expression`
        true
    """
  }
  {
    name = "Evaluate before true after statements"
    description = "The result of x || true is always true, but x may print or recurse. Keep that evaluation before the final true."
    pattern = """
      def `?function`(@mult `?args`: `?argTypes`): `?resultType` =
        `?before`: @mult
        `?expression` || true
    """
    rewrite = """
      def `?function`(@mult `?args`: `?argTypes`): `?resultType` =
        `?before`: @mult
        `?expression`
        true
    """
  }
  {
    name = "Search with early returns"
    description = "Try avoiding this style of early returns, they can make the control flow harder to follow. The last two conditions can be merged with one `||` operator."
    match-fqn = false
    pattern = """
      def `?function`(`?firstArg`: `?firstType`, `?secondArg`: `?secondType`): Boolean =
        if `?first` then
          `?effect`
          return true
        if `?second` then return true
        if `?third` then return true
        false
    """
    rewrite = """
      def `?function`(`?firstArg`: `?firstType`, `?secondArg`: `?secondType`): Boolean =
        if `?first` then
          `?effect`
          true
        else `?second` || `?third`
    """
  }
  {
    name = "Final return"
    description = "Scala returns the value of a method's last expression automatically. Removing return here keeps the same result and makes the flow easier to read."
    pattern = """
      def `?function`(@mult `?args`: `?argTypes`): `?resultType` =
        `?before`: @mult
        return `?value`
    """
    rewrite = """
      def `?function`(@mult `?args`: `?argTypes`): `?resultType` =
        `?before`: @mult
        `?value`
    """
  }
  {
    name = "Combine equal Boolean branches"
    description = "Both successful branches do the same work. Combine their conditions with ||, so the second test runs only if the first is false, and keep the shared work once."
    pattern = """
      if `?first` then
        `?effect`
        true
      else if `?second` then
        `?effect`
        true
      else false
    """
    rewrite = """
      if `?first` || `?second` then
        `?effect`
        true
      else false
    """
  }
  {
    name = "Identical if branches"
    description = "Both branches are identical, so the choice cannot change the result. Still evaluate the condition once in case it has effects, then run the shared branch."
    pattern = """if `?condition` then `?body` else `?body`"""
    rewrite = """{ `?condition`; `?body` }"""
  }
  {
    name = "Extract effect from Boolean if"
    description = "Let the val record whether the condition holds. Run the side effect in a separate if when that val is true; this avoids hiding an action inside a Boolean value."
    pattern = """
      {
        `?before`: @mult
        val `?here` =
          if `?condition` then
            `?effect`
            true
          else false
        `?after`: @mult1
      }
    """
    rewrite = """
      {
        `?before`: @mult
        val `?here` = `?condition`
        if `?here` then `?effect`
        `?after`: @mult1
      }
    """
  }
  {
    name = "Decouple value and side-effect form nested ifs"
    description = "Both successful paths perform the same action. Compute which path succeeds first, then perform the action once when that result is true."
    pattern = """
      {
        `?before`: @mult
        val `?here` =
          if `?outer` then
            if `?check1` then
              `?effect`
              true
            else false
          else if `?check2` then
            `?effect`
            true
          else false
        `?after`: @mult1
      }
    """
    rewrite = """
      {
        `?before`: @mult
        val `?here` = if `?outer` then `?check1` else `?check2`
        if `?here` then `?effect`
        `?after`: @mult1
      }
    """
  }
  {
    name = "Inline final val"
    description = "This val is read only by the immediately following final expression. Use its initializer directly as the block's result instead of naming it once."
    match-ascriptions = true
    pattern = """
      {
        `?before`: @mult
        val `?name` = `?value`
        `?name`
      }
    """
    rewrite = """
      {
        `?before`: @mult
        `?value`
      }
    """
  }
  {
    name = "Unused if result"
    description = "Another statement follows this if, so its true/false result is discarded. Keep the condition and any actions it performs, but remove the unused Boolean values."
    pattern = """
      {
        `?before`: @mult
        if `?condition` then
          `?firstEffect`
          `?moreEffects`: @mult
          true
        else false
        `?after`: @mult1
      }
    """
    rewrite = """
      {
        `?before`: @mult
        if `?condition` then
          `?firstEffect`
          `?moreEffects`: @mult
        `?after`: @mult1
      }
    """
  }
  {
    name = "Unused else false"
    description = "Another statement follows this if, so its result is ignored. The else branch only produces false and can be removed without changing the actions performed."
    pattern = """
      {
        `?before`: @mult
        if `?condition` then `?body` else false
        `?next`
        `?after`: @mult
      }
    """
    rewrite = """
      {
        `?before`: @mult
        if `?condition` then `?body`
        `?next`
        `?after`: @mult
      }
    """
  }
  {
    name = "if c then true else false"
    description = "The if returns true exactly when its condition is true. Use the condition itself as the Boolean result."
    pattern = """if `?condition` then true else false"""
    rewrite = """`?condition`"""
  }
  {
    name = "if c then false else true"
    description = "The if returns true exactly when its condition is false. Negate the condition instead of spelling out both Boolean branches."
    pattern = """if `?condition` then false else true"""
    rewrite = """!`?condition`"""
  }
  {
    name = "if c then false else b"
    description = "The other expression matters only when the condition is false. Use !condition && expression; && still skips the expression when the condition is true."
    pattern = """if `?condition` then false else (`?expression`: Boolean)"""
    rewrite = """!`?condition` && `?expression`"""
  }
  {
    name = "if c then b else true"
    description = "When the condition is false the result is already true. Use !condition || expression so the expression runs only in the other case."
    pattern = """if `?condition` then (`?expression`: Boolean) else true"""
    rewrite = """!`?condition` || `?expression`"""
  }
  {
    name = "if c then true else b"
    description = "When the condition is true the result is already true. Use condition || expression so the expression runs only when needed."
    pattern = """if `?condition` then true else (`?expression`: Boolean)"""
    rewrite = """`?condition` || `?expression`"""
  }
  {
    name = "if c then b else false"
    description = "The expression matters only when the condition is true. Use condition && expression so the false case skips it."
    pattern = """if `?condition` then (`?expression`: Boolean) else false"""
    rewrite = """`?condition` && `?expression`"""
  }
  {
    name = "Nested if guards"
    description = "The inner test is reached only if the outer test succeeds. Combine them with && and keep the guarded action in one place."
    pattern = """
      if `?outer` then
        if `?inner` then
          `?body`
    """
    rewrite = """
      if `?outer` && `?inner` then
        `?body`
    """
  }
  {
    name = "b == true"
    description = "A Boolean value already says whether it is true. Use the value directly instead of comparing it with true."
    pattern = """(`?expression`: Boolean) == true"""
    rewrite = """`?expression`"""
  }
  {
    name = "true == b"
    description = "A Boolean value already says whether it is true. Use the value directly instead of comparing it with true."
    pattern = """true == (`?expression`: Boolean)"""
    rewrite = """`?expression`"""
  }
  {
    name = "b == false"
    description = "Testing whether a Boolean is false is the same as negating it. Use !value to make the test direct."
    pattern = """(`?expression`: Boolean) == false"""
    rewrite = """!`?expression`"""
  }
  {
    name = "false == b"
    description = "Testing whether a Boolean is false is the same as negating it. Use !value to make the test direct."
    pattern = """false == (`?expression`: Boolean)"""
    rewrite = """!`?expression`"""
  }
  {
    name = "b != false"
    description = "A Boolean differs from false exactly when it is true. Use the Boolean value directly."
    pattern = """(`?expression`: Boolean) != false"""
    rewrite = """`?expression`"""
  }
  {
    name = "false != b"
    description = "A Boolean differs from false exactly when it is true. Use the Boolean value directly."
    pattern = """false != (`?expression`: Boolean)"""
    rewrite = """`?expression`"""
  }
  {
    name = "b != true"
    description = "A Boolean differs from true exactly when it is false. Use !value instead of comparing with true."
    pattern = """(`?expression`: Boolean) != true"""
    rewrite = """!`?expression`"""
  }
  {
    name = "true != b"
    description = "A Boolean differs from true exactly when it is false. Use !value instead of comparing with true."
    pattern = """true != (`?expression`: Boolean)"""
    rewrite = """!`?expression`"""
  }
  {
    name = "!!b"
    description = "Negating a Boolean twice gives its original value. Remove the two ! operators."
    pattern = """!(!(`?expression`: Boolean))"""
    rewrite = """`?expression`"""
  }
  {
    name = "0 == Int"
    description = "Write the Int expression first, as in size == 0. Equality is symmetric here; this order makes the value being tested easier to spot."
    pattern = """0 == (`?number`: Int)"""
    rewrite = """`?number` == 0"""
  }
  {
    name = "0 != Int"
    description = "Write the Int expression first, as in size != 0. Equality is symmetric here; this order makes the value being tested easier to spot."
    pattern = """0 != (`?number`: Int)"""
    rewrite = """`?number` != 0"""
  }
  {
    name = "1 == Int"
    description = "Write the Int expression first, as in count == 1. Equality is symmetric here; this order reads like an ordinary test of count."
    pattern = """1 == (`?number`: Int)"""
    rewrite = """`?number` == 1"""
  }
  {
    name = "1 != Int"
    description = "Write the Int expression first, as in count != 1. Equality is symmetric here; this order reads like an ordinary test of count."
    pattern = """1 != (`?number`: Int)"""
    rewrite = """`?number` != 1"""
  }
  {
    name = "0 == Long"
    description = "Write the Long expression first, as in size == 0. Equality is symmetric here; this order makes the value being tested easier to spot."
    pattern = """0 == (`?number`: Long)"""
    rewrite = """`?number` == 0"""
  }
  {
    name = "0 != Long"
    description = "Write the Long expression first, as in size != 0. Equality is symmetric here; this order makes the value being tested easier to spot."
    pattern = """0 != (`?number`: Long)"""
    rewrite = """`?number` != 0"""
  }
  {
    name = "1 == Long"
    description = "Write the Long expression first, as in size == 1. Equality is symmetric here; this order makes the value being tested easier to spot."
    pattern = """1 == (`?number`: Long)"""
    rewrite = """`?number` == 1"""
  }
  {
    name = "1 != Long"
    description = "Write the Long expression first, as in size != 1. Equality is symmetric here; this order makes the value being tested easier to spot."
    pattern = """1 != (`?number`: Long)"""
    rewrite = """`?number` != 1"""
  }
  {
    name = "!(a == b)"
    description = "Negating equality asks whether the values differ. Write a != b directly so the comparison states its intent."
    pattern = """!(`?left` == `?right`)"""
    rewrite = """`?left` != `?right`"""
  }
  {
    name = "!(a != b)"
    description = "Negating inequality asks whether the values are equal. Write a == b directly so the comparison states its intent."
    pattern = """!(`?left` != `?right`)"""
    rewrite = """`?left` == `?right`"""
  }
  {
    name = "Choose by stable Boolean"
    description = "The same stable Boolean is checked in both halves. An if chooses the corresponding branch without repeating that check."
    stable-boolean-bindings = ["condition"]
    pattern = """(!`?condition` && (`?whenFalse`: Boolean)) || (`?condition` && (`?whenTrue`: Boolean))"""
    rewrite = """if `?condition` then `?whenTrue` else `?whenFalse`"""
  }
  {
    name = "Strict Boolean |"
    description = "Unlike ||, | evaluates both Boolean operands even when the left is true. Use || when short-circuit evaluation is intended."
    pattern = """(`?left`: Boolean) | (`?right`: Boolean)"""
  }
  {
    name = "true && b"
    description = "true never prevents the right-hand Boolean from being evaluated. The result is simply that right-hand value."
    pattern = """true && (`?expression`: Boolean)"""
    rewrite = """`?expression`"""
  }
  {
    name = "false && b"
    description = "&& stops as soon as its left side is false, so the right side is not evaluated. This expression is just false."
    pattern = """false && (`?expression`: Boolean)"""
    rewrite = """false"""
  }
  {
    name = "b && true"
    description = "The right side cannot change a true left side. Keep the left-hand Boolean, including its evaluation."
    pattern = """(`?expression`: Boolean) && true"""
    rewrite = """`?expression`"""
  }
  {
    name = "b && false"
    description = "The result is false, but the left side still runs and might print, recurse, or throw. Do not erase that evaluation without checking its effects."
    pattern = """(`?expression`: Boolean) && false"""
  }
  {
    name = "false || b"
    description = "false cannot make || succeed, so the right side still runs and supplies the result. Use it directly."
    pattern = """false || (`?expression`: Boolean)"""
    rewrite = """`?expression`"""
  }
  {
    name = "true || b"
    description = "|| stops as soon as its left side is true, so the right side is not evaluated. This expression is just true."
    pattern = """true || (`?expression`: Boolean)"""
    rewrite = """true"""
  }
  {
    name = "b || false"
    description = "The right side cannot change the result. Keep the left-hand Boolean, including its evaluation."
    pattern = """(`?expression`: Boolean) || false"""
    rewrite = """`?expression`"""
  }
  {
    name = "b || true"
    description = "The result is true, but the left side still runs and might print, recurse, or throw. Do not erase that evaluation without checking its effects."
    pattern = """(`?expression`: Boolean) || true"""
  }
  {
    name = "true & b"
    description = "Unlike &&, & evaluates both Boolean sides. The constant true adds nothing; keep the right side and its evaluation."
    pattern = """true & (`?expression`: Boolean)"""
    rewrite = """`?expression`"""
  }
  {
    name = "b & true"
    description = "Unlike &&, & evaluates both Boolean sides. The constant true adds nothing; keep the left side and its evaluation."
    pattern = """(`?expression`: Boolean) & true"""
    rewrite = """`?expression`"""
  }
  {
    name = "false & b"
    description = "Strict & evaluates the right side even though the result is false. Check for effects before replacing the whole expression."
    pattern = """false & (`?expression`: Boolean)"""
  }
  {
    name = "b & false"
    description = "Strict & evaluates the left side even though the result is false. Check for effects before replacing the whole expression."
    pattern = """(`?expression`: Boolean) & false"""
  }
  {
    name = "false | b"
    description = "Strict | evaluates both sides, and false adds nothing to the result. Keep the right-hand Boolean."
    pattern = """false | (`?expression`: Boolean)"""
    rewrite = """`?expression`"""
  }
  {
    name = "b | false"
    description = "Strict | evaluates both sides, and false adds nothing to the result. Keep the left-hand Boolean."
    pattern = """(`?expression`: Boolean) | false"""
    rewrite = """`?expression`"""
  }
  {
    name = "true | b"
    description = "Strict | still evaluates the right side even though the result is true. Check for effects before dropping it."
    pattern = """true | (`?expression`: Boolean)"""
  }
  {
    name = "b | true"
    description = "Strict | still evaluates the left side even though the result is true. Check for effects before dropping it."
    pattern = """(`?expression`: Boolean) | true"""
  }
  {
    name = "false ^ b"
    description = "Exclusive-or with false leaves a Boolean unchanged. Keep the other side and its evaluation."
    pattern = """false ^ (`?expression`: Boolean)"""
    rewrite = """`?expression`"""
  }
  {
    name = "b ^ false"
    description = "Exclusive-or with false leaves a Boolean unchanged. Keep the other side and its evaluation."
    pattern = """(`?expression`: Boolean) ^ false"""
    rewrite = """`?expression`"""
  }
  {
    name = "true ^ b"
    description = "Exclusive-or with true flips the other Boolean. Negate that value instead."
    pattern = """true ^ (`?expression`: Boolean)"""
    rewrite = """!`?expression`"""
  }
  {
    name = "b ^ true"
    description = "Exclusive-or with true flips the other Boolean. Negate that value instead."
    pattern = """(`?expression`: Boolean) ^ true"""
    rewrite = """!`?expression`"""
  }
  {
    name = "n + 0"
    description = "Adding zero leaves this numeric value unchanged. Use the value directly."
    pattern = """(`?number`: Int) + 0"""
    rewrite = """`?number`"""
  }
  {
    name = "0 + n"
    description = "Adding zero leaves this numeric value unchanged. Use the value directly."
    pattern = """0 + (`?number`: Int)"""
    rewrite = """`?number`"""
  }
  {
    name = "n - 0"
    description = "Subtracting zero leaves this numeric value unchanged. Use the value directly."
    pattern = """(`?number`: Int) - 0"""
    rewrite = """`?number`"""
  }
  {
    name = "n * 1"
    description = "Multiplying by one leaves this numeric value unchanged. Use the value directly."
    pattern = """(`?number`: Int) * 1"""
    rewrite = """`?number`"""
  }
  {
    name = "1 * n"
    description = "Multiplying by one leaves this numeric value unchanged. Use the value directly."
    pattern = """1 * (`?number`: Int)"""
    rewrite = """`?number`"""
  }
  {
    name = "n / 1"
    description = "Dividing this numeric value by one leaves it unchanged. Use the value directly."
    pattern = """(`?number`: Int) / 1"""
    rewrite = """`?number`"""
  }
  {
    name = "+n"
    description = "Unary + leaves this numeric value unchanged. Omit it to make the expression shorter."
    pattern = """+(`?number`: Int)"""
    rewrite = """`?number`"""
  }
  {
    name = "-(-n)"
    description = "Two numeric negations cancel. Use the original value directly."
    pattern = """-(-(`?number`: Int))"""
    rewrite = """`?number`"""
  }
  {
    name = ".equals"
    description = "For ordinary value comparison, Scala's == is usually clearer and handles null safely. Review the operands first: .equals can behave differently for null or mixed numeric types."
    pattern = """`?left`.equals(`?right`)"""
  }
  {
    name = "Inline one-argument helper"
    description = "This helper is called immediately and repeats the outer function's one-argument shape. Consider putting its recursive work in the outer function to remove an unnecessary layer."
    pattern = """
      def `?outer`(`?outerArg`: `?argType`): `?resultType` =
        def `?helper`(`?helperArg`: `?argType`): `?resultType` =
          `?body`
        `?helper`(`?outerArg`)
    """
    rewrite = """
      def `?outer`(`?outerArg`: `?argType`): `?resultType` =
        `?body`(`?helper` --> `?outer`, `?helperArg` --> `?outerArg`)
    """
  }
  {
    name = "Inline two-argument helper"
    description = "This helper is called immediately and repeats the outer function's two-argument shape. Consider putting its recursive work in the outer function to remove an unnecessary layer."
    pattern = """
      def `?outer`(`?outerArg1`: `?argType1`, `?outerArg2`: `?argType2`): `?resultType` =
        def `?helper`(`?helperArg1`: `?argType1`, `?helperArg2`: `?argType2`): `?resultType` =
          `?body`
        `?helper`(`?outerArg1`, `?outerArg2`)
    """
    rewrite = """
      def `?outer`(`?outerArg1`: `?argType1`, `?outerArg2`: `?argType2`): `?resultType` =
        `?body`(
          `?helper` --> `?outer`,
          `?helperArg1` --> `?outerArg1`,
          `?helperArg2` --> `?outerArg2`
        )
    """
  }
  {
    name = "Single-expression then block"
    description = "The then branch contains only one expression. Scala 3 indentation can express that branch directly without an extra block."
    match-blocks = true
    pattern = """if `?condition` then { `?expression` }"""
    rewrite = """if `?condition` then `?expression`"""
  }
  {
    name = "Single-expression then block with else"
    description = "The then branch contains only one expression. Remove its extra block while keeping the else branch attached to the same if."
    match-blocks = true
    pattern = """if `?condition` then { `?expression` } else `?alternative`"""
    rewrite = """if `?condition` then `?expression` else `?alternative`"""
  }
  {
    name = "Single-expression else block"
    description = "The else branch contains only one expression. Remove its extra block while leaving the then branch unchanged."
    match-blocks = true
    pattern = """if `?condition` then `?alternative` else { `?expression` }"""
    rewrite = """if `?condition` then `?alternative` else `?expression`"""
  }
  {
    name = "Single-expression while block"
    description = "The while body has one expression. Scala 3 can use that expression directly without an extra block."
    match-blocks = true
    pattern = """while `?condition` do { `?expression` }"""
    rewrite = """while `?condition` do `?expression`"""
  }
  {
    name = "Single-expression val block"
    description = "This val's initializer is a block with one expression. Use that expression directly; the val receives the same result."
    match-ascriptions = true
    match-blocks = true
    pattern = """val `?name` = { `?expression` }"""
    rewrite = """val `?name` = `?expression`"""
  }
  {
    name = "Single-expression typed val block"
    description = "This typed val's initializer is a block with one expression. Use that expression directly and keep the declared type."
    match-ascriptions = true
    match-blocks = true
    pattern = """val `?name`: `?type` = { `?expression` }"""
    rewrite = """val `?name`: `?type` = `?expression`"""
  }
]

token-rules = [
  {
    name = "Uppercase function"
    description = "Method names start with a lowercase letter in Scala. Use lowerCamelCase, such as findByName, to distinguish methods from types."
    target-kind = "function"
    pattern = "^[A-Z]"
  }
  {
    name = "Uppercase val"
    description = "Value names start with a lowercase letter in Scala. Use lowerCamelCase, such as foundHere, to distinguish values from types."
    target-kind = "value"
    pattern = "^[A-Z]"
  }
  {
    name = "Uppercase parameter"
    description = "Parameter names start with a lowercase letter in Scala. Use lowerCamelCase, such as minSize, so they read like values rather than types."
    target-kind = "parameter"
    pattern = "^[A-Z]"
  }
  {
    name = "!true"
    description = "Negating the constant true always gives false. Write false directly."
    pattern = "!true"
    rewrite = "false"
  }
  {
    name = "!false"
    description = "Negating the constant false always gives true. Write true directly."
    pattern = "!false"
    rewrite = "true"
  }
  {
    name = "Line-ending semicolon"
    description = "A newline already separates these Scala 3 statements. Remove the trailing semicolon; keep semicolons only where they separate statements on one line."
    pattern = """;(?=[ \t]*(?://[^\r\n]*)?(?:\r?\n|$))"""
    rewrite = ""
  }
]
