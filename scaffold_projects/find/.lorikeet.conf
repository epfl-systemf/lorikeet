max-rewrites = 200

rules = [
  # A false else branch can only be removed when the surrounding block proves
  # that the if's value is discarded. Put these contextual rules before the
  # expression-level Boolean observations.
  {
    name = "Discarded Boolean Result"
    description = "The result of this non-final if is discarded; keep its effects and remove its literal Boolean results"
    pattern = """
      {
        `?before`: @mult
        if `?condition` then
          `?firstEffect`
          `?moreEffects`: @mult
          true
        else false
        `?next`
        `?after`: @mult
      }
    """
    rewrite = """
      {
        `?before`: @mult
        if `?condition` then
          `?firstEffect`
          `?moreEffects`: @mult
        `?next`
        `?after`: @mult
      }
    """
  }
  {
    name = "Discarded False Else Branch"
    description = "The result of this non-final if is discarded, so its literal false else branch is unnecessary"
    pattern = """
      {
        `?before`: @mult
        if `?condition` then `?body` else false
        `?next`
        `?after`: @mult
      }
    """
    rewrite = """
      {
        `?before`: @mult
        if `?condition` then `?body`
        `?next`
        `?after`: @mult
      }
    """
  }

  # The two fully constant Boolean conditionals are safe in every context.
  {
    name = "Boolean If"
    description = "if c then true else false  ==>  c"
    pattern = """if `?condition` then true else false"""
    rewrite = """`?condition`"""
  }
  {
    name = "Boolean If"
    description = "if c then false else true  ==>  !c"
    pattern = """if `?condition` then false else true"""
    rewrite = """!`?condition`"""
  }
  {
    name = "Boolean If"
    description = "A Boolean 'if c then false else e' can be simplified to '!c && e'; review blocks before changing it"
    pattern = """if `?condition` then false else (`?expression`: Boolean)"""
  }
  {
    name = "Boolean If"
    description = "A Boolean 'if c then e else true' can be simplified to '!c || e'; review blocks before changing it"
    pattern = """if `?condition` then (`?expression`: Boolean) else true"""
  }
  {
    name = "Boolean If"
    description = "A Boolean 'if c then true else e' can be simplified to 'c || e'; review blocks before changing it"
    pattern = """if `?condition` then true else (`?expression`: Boolean)"""
  }
  {
    name = "Boolean If"
    description = "A Boolean 'if c then e else false' can be simplified to 'c && e'; review blocks before changing it"
    pattern = """if `?condition` then (`?expression`: Boolean) else false"""
  }
  {
    name = "Nested Side-effecting If"
    description = "Combine nested conditions that guard the same side effect"
    pattern = """
      if `?outer` then
        if `?inner` then
          `?body`
    """
    rewrite = """
      if `?outer` && `?inner` then
        `?body`
    """
  }
  # Boolean negation and equality.
  {
    name = "Boolean Negation"
    description = "!true  ==>  false"
    pattern = """!true"""
    rewrite = """false"""
  }
  {
    name = "Boolean Negation"
    description = "!false  ==>  true"
    pattern = """!false"""
    rewrite = """true"""
  }
  {
    name = "Boolean Comparison"
    description = "b == true  ==>  b"
    pattern = """(`?expression`: Boolean) == true"""
    rewrite = """`?expression`"""
  }
  {
    name = "Boolean Comparison"
    description = "true == b  ==>  b"
    pattern = """true == (`?expression`: Boolean)"""
    rewrite = """`?expression`"""
  }
  {
    name = "Boolean Comparison"
    description = "b == false  ==>  !b"
    pattern = """(`?expression`: Boolean) == false"""
    rewrite = """!`?expression`"""
  }
  {
    name = "Boolean Comparison"
    description = "false == b  ==>  !b"
    pattern = """false == (`?expression`: Boolean)"""
    rewrite = """!`?expression`"""
  }
  {
    name = "Boolean Comparison"
    description = "b != false  ==>  b"
    pattern = """(`?expression`: Boolean) != false"""
    rewrite = """`?expression`"""
  }
  {
    name = "Boolean Comparison"
    description = "false != b  ==>  b"
    pattern = """false != (`?expression`: Boolean)"""
    rewrite = """`?expression`"""
  }
  {
    name = "Boolean Comparison"
    description = "b != true  ==>  !b"
    pattern = """(`?expression`: Boolean) != true"""
    rewrite = """!`?expression`"""
  }
  {
    name = "Boolean Comparison"
    description = "true != b  ==>  !b"
    pattern = """true != (`?expression`: Boolean)"""
    rewrite = """!`?expression`"""
  }
  {
    name = "Double Negation"
    description = "!!b  ==>  b"
    pattern = """!(!(`?expression`: Boolean))"""
    rewrite = """`?expression`"""
  }
  {
    name = "Negated Equality"
    description = "!(a == b)  ==>  a != b"
    pattern = """!(`?left` == `?right`)"""
    rewrite = """`?left` != `?right`"""
  }
  {
    name = "Negated Inequality"
    description = "!(a != b)  ==>  a == b"
    pattern = """!(`?left` != `?right`)"""
    rewrite = """`?left` == `?right`"""
  }

  # Short-circuit Boolean operators. The two right-hand absorbing cases are
  # observations only because rewriting them would skip evaluation of b.
  {
    name = "Boolean And Constant"
    description = "true && b  ==>  b"
    pattern = """true && (`?expression`: Boolean)"""
    rewrite = """`?expression`"""
  }
  {
    name = "Boolean And Constant"
    description = "false && b  ==>  false"
    pattern = """false && (`?expression`: Boolean)"""
    rewrite = """false"""
  }
  {
    name = "Boolean And Constant"
    description = "b && true  ==>  b"
    pattern = """(`?expression`: Boolean) && true"""
    rewrite = """`?expression`"""
  }
  {
    name = "Boolean And Constant"
    description = "b && false is false, but b must be pure before its evaluation can be removed"
    pattern = """(`?expression`: Boolean) && false"""
  }
  {
    name = "Boolean Or Constant"
    description = "false || b  ==>  b"
    pattern = """false || (`?expression`: Boolean)"""
    rewrite = """`?expression`"""
  }
  {
    name = "Boolean Or Constant"
    description = "true || b  ==>  true"
    pattern = """true || (`?expression`: Boolean)"""
    rewrite = """true"""
  }
  {
    name = "Boolean Or Constant"
    description = "b || false  ==>  b"
    pattern = """(`?expression`: Boolean) || false"""
    rewrite = """`?expression`"""
  }
  {
    name = "Boolean Or Constant"
    description = "b || true is true, but b must be pure before its evaluation can be removed"
    pattern = """(`?expression`: Boolean) || true"""
  }

  # Strict Boolean operators. Identity rewrites retain the non-constant
  # operand's evaluation. Absorbing rewrites are lint-only because & and |
  # evaluate both operands.
  {
    name = "Strict Boolean And Constant"
    description = "true & b  ==>  b"
    pattern = """true & (`?expression`: Boolean)"""
    rewrite = """`?expression`"""
  }
  {
    name = "Strict Boolean And Constant"
    description = "b & true  ==>  b"
    pattern = """(`?expression`: Boolean) & true"""
    rewrite = """`?expression`"""
  }
  {
    name = "Strict Boolean And Constant"
    description = "false & b is false, but strict & still evaluates b"
    pattern = """false & (`?expression`: Boolean)"""
  }
  {
    name = "Strict Boolean And Constant"
    description = "b & false is false, but strict & still evaluates b"
    pattern = """(`?expression`: Boolean) & false"""
  }
  {
    name = "Strict Boolean Or Constant"
    description = "false | b  ==>  b"
    pattern = """false | (`?expression`: Boolean)"""
    rewrite = """`?expression`"""
  }
  {
    name = "Strict Boolean Or Constant"
    description = "b | false  ==>  b"
    pattern = """(`?expression`: Boolean) | false"""
    rewrite = """`?expression`"""
  }
  {
    name = "Strict Boolean Or Constant"
    description = "true | b is true, but strict | still evaluates b"
    pattern = """true | (`?expression`: Boolean)"""
  }
  {
    name = "Strict Boolean Or Constant"
    description = "b | true is true, but strict | still evaluates b"
    pattern = """(`?expression`: Boolean) | true"""
  }
  {
    name = "Strict Boolean Xor Constant"
    description = "false ^ b  ==>  b"
    pattern = """false ^ (`?expression`: Boolean)"""
    rewrite = """`?expression`"""
  }
  {
    name = "Strict Boolean Xor Constant"
    description = "b ^ false  ==>  b"
    pattern = """(`?expression`: Boolean) ^ false"""
    rewrite = """`?expression`"""
  }
  {
    name = "Strict Boolean Xor Constant"
    description = "true ^ b  ==>  !b"
    pattern = """true ^ (`?expression`: Boolean)"""
    rewrite = """!`?expression`"""
  }
  {
    name = "Strict Boolean Xor Constant"
    description = "b ^ true  ==>  !b"
    pattern = """(`?expression`: Boolean) ^ true"""
    rewrite = """!`?expression`"""
  }
  {
    name = "Strict Boolean Or"
    description = "Boolean | always evaluates both sides; use || when short-circuiting is intended"
    pattern = """(`?left`: Boolean) | (`?right`: Boolean)"""
  }

  # Int identities used by the lab. Explicit Boolean/Int constraints prevent
  # these generic-looking rules from rewriting user-defined operators.
  {
    name = "Integer Identity"
    description = "n + 0  ==>  n"
    pattern = """(`?number`: Int) + 0"""
    rewrite = """`?number`"""
  }
  {
    name = "Integer Identity"
    description = "0 + n  ==>  n"
    pattern = """0 + (`?number`: Int)"""
    rewrite = """`?number`"""
  }
  {
    name = "Integer Identity"
    description = "n - 0  ==>  n"
    pattern = """(`?number`: Int) - 0"""
    rewrite = """`?number`"""
  }
  {
    name = "Integer Identity"
    description = "n * 1  ==>  n"
    pattern = """(`?number`: Int) * 1"""
    rewrite = """`?number`"""
  }
  {
    name = "Integer Identity"
    description = "1 * n  ==>  n"
    pattern = """1 * (`?number`: Int)"""
    rewrite = """`?number`"""
  }
  {
    name = "Integer Identity"
    description = "n / 1  ==>  n"
    pattern = """(`?number`: Int) / 1"""
    rewrite = """`?number`"""
  }
  {
    name = "Integer Identity"
    description = "+n  ==>  n"
    pattern = """+(`?number`: Int)"""
    rewrite = """`?number`"""
  }
  {
    name = "Integer Identity"
    description = "-(-n)  ==>  n"
    pattern = """-(-(`?number`: Int))"""
    rewrite = """`?number`"""
  }

  # Find-lab observations and rewrites from find_notes.local.md.
  {
    name = "Equals Method"
    description = "Prefer Scala's == when null-safe Scala equality is intended; this is not an automatic rewrite because null and numeric cases differ"
    pattern = """`?left`.equals(`?right`)"""
  }
  {
    name = "Inline Single-use Helper Function"
    description = "This local recursive helper has the same one-parameter signature and is immediately called; use the outer function directly"
    pattern = """
      def `?outer`(`?outerArg`: `?argType`): `?resultType` =
        def `?helper`(`?helperArg`: `?argType`): `?resultType` =
          `?body`
        `?helper`(`?outerArg`)
    """
    rewrite = """
      def `?outer`(`?outerArg`: `?argType`): `?resultType` =
        `?body`(`?helper` --> `?outer`, `?helperArg` --> `?outerArg`)
    """
  }
  {
    name = "Inline Single-use Helper Function"
    description = "This local recursive helper has the same two-parameter signature and is immediately called; use the outer function directly"
    pattern = """
      def `?outer`(`?outerArg1`: `?argType1`, `?outerArg2`: `?argType2`): `?resultType` =
        def `?helper`(`?helperArg1`: `?argType1`, `?helperArg2`: `?argType2`): `?resultType` =
          `?body`
        `?helper`(`?outerArg1`, `?outerArg2`)
    """
    rewrite = """
      def `?outer`(`?outerArg1`: `?argType1`, `?outerArg2`: `?argType2`): `?resultType` =
        `?body`(
          `?helper` --> `?outer`,
          `?helperArg1` --> `?outerArg1`,
          `?helperArg2` --> `?outerArg2`
        )
    """
  }
  {
    name = "Var Usage"
    description = "Use vals and recursion instead of mutable state"
    pattern = """var `?name`: `?` = `?initial`"""
  }
  {
    name = "Var Usage"
    description = "Use vals and recursion instead of mutable state"
    pattern = """var `?name` = `?initial`"""
  }
  {
    name = "Var Usage"
    description = "Use vals and recursion instead of mutable state"
    pattern = """var `?name`: `?`"""
  }
  {
    name = "Early Return"
    description = "An early return makes this recursive search harder to compose"
    pattern = """return true"""
  }
  {
    name = "Return In Return Position"
    description = "The final expression is returned without an explicit return"
    pattern = """return `?value`"""
  }
  {
    name = "While Loop"
    description = "Use recursion for sibling traversal in this exercise"
    pattern = """
      while `?condition` do
        `?body`
    """
  }
  {
    name = "For Loop"
    description = "Use direct structural recursion in this exercise"
    pattern = """
      for `?name` <- `?values` do
        `?body`
    """
  }
  {
    name = "Unexpected Import"
    description = "Remove imports that are not needed by the solution"
    pattern = """import scala.util.Random"""
  }
  {
    name = "Uppercase Parameter Name"
    description = "Name parameters with lowerCamelCase"
    match-fqn = false
    pattern = """def helperParcours(`?F`: cs214.Entry => Boolean, `?E`: cs214.Entry): Boolean = `?body`"""
  }
  {
    name = "Higher-order Function Too Early"
    description = "This exercise asks for direct structural recursion before the later higher-order refactor"
    match-fqn = false
    pattern = """def `?function`(`?predicate`: cs214.Entry => Boolean, `?entry`: cs214.Entry): Boolean = `?body`"""
  }
  {
    name = "Higher-order Function Too Early"
    description = "This exercise asks for direct structural recursion before the later higher-order refactor"
    match-fqn = false
    pattern = """def `?function`(`?entry`: cs214.Entry, `?predicate`: cs214.Entry => Boolean): Boolean = `?body`"""
  }
  {
    name = "Higher-order Function Too Early"
    description = "This exercise asks for direct structural recursion before the later higher-order refactor"
    match-fqn = false
    pattern = """def `?function`(`?predicate`: Entry => Boolean, `?entry`: Entry): Boolean = `?body`"""
  }
  {
    name = "Higher-order Function Too Early"
    description = "This exercise asks for direct structural recursion before the later higher-order refactor"
    match-fqn = false
    pattern = """def `?function`(`?entry`: Entry, `?predicate`: Entry => Boolean): Boolean = `?body`"""
  }

  # Flatten singleton blocks only where the surrounding syntax is preserved.
  # A bare `{ expression }` rule is unsafe in call-argument and interpolation
  # contexts.
  {
    name = "Singleton If Block"
    description = "A singleton then block can be flattened"
    match-blocks = true
    pattern = """if `?condition` then { `?expression` }"""
    rewrite = """if `?condition` then `?expression`"""
  }
  {
    name = "Singleton If Block"
    description = "A singleton then block can be flattened without changing the else branch"
    match-blocks = true
    pattern = """if `?condition` then { `?expression` } else `?alternative`"""
    rewrite = """if `?condition` then `?expression` else `?alternative`"""
  }
  {
    name = "Singleton If Block"
    description = "A singleton else block can be flattened without changing the then branch"
    match-blocks = true
    pattern = """if `?condition` then `?alternative` else { `?expression` }"""
    rewrite = """if `?condition` then `?alternative` else `?expression`"""
  }
  {
    name = "Singleton While Block"
    description = "A singleton while body can be flattened"
    match-blocks = true
    pattern = """while `?condition` do { `?expression` }"""
    rewrite = """while `?condition` do `?expression`"""
  }
  {
    name = "Singleton Val Block"
    description = "A singleton block on an untyped val's right-hand side can be flattened"
    match-ascriptions = true
    match-blocks = true
    pattern = """val `?name` = { `?expression` }"""
    rewrite = """val `?name` = `?expression`"""
  }
  {
    name = "Singleton Val Block"
    description = "A singleton block on a typed val's right-hand side can be flattened"
    match-ascriptions = true
    match-blocks = true
    pattern = """val `?name`: `?type` = { `?expression` }"""
    rewrite = """val `?name`: `?type` = `?expression`"""
  }
]

token-rules = [
  {
    name = "Semicolon Usage"
    description = "A line-ending semicolon may be unnecessary; review the following line before removing it"
    pattern = """;(?=[ \t]*(?://[^\r\n]*)?(?:\r?\n|$))"""
  }
]
