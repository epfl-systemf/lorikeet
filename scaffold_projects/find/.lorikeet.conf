max-rewrites = 200

rules = [
  {
    name = "Evaluate before true"
    description = "Evaluate the Boolean expression for its effects, then return true"
    pattern = """
      def `?function`(@mult `?args`: `?argTypes`): `?resultType` =
        `?expression` || true
    """
    rewrite = """
      def `?function`(@mult `?args`: `?argTypes`): `?resultType` =
        `?expression`
        true
    """
  }
  {
    name = "Evaluate before true after statements"
    description = "Evaluate the Boolean expression for its effects, then return true"
    pattern = """
      def `?function`(@mult `?args`: `?argTypes`): `?resultType` =
        `?before`: @mult
        `?expression` || true
    """
    rewrite = """
      def `?function`(@mult `?args`: `?argTypes`): `?resultType` =
        `?before`: @mult
        `?expression`
        true
    """
  }
  # Match the whole Boolean method: replacing non-local returns inside a
  # smaller expression could accidentally execute code after the expression.
  {
    name = "Search with early returns"
    description = "Compose the three search branches with short-circuiting instead of returning early"
    match-fqn = false
    pattern = """
      def `?function`(`?firstArg`: `?firstType`, `?secondArg`: `?secondType`): Boolean =
        if `?first` then
          `?effect`
          return true
        if `?second` then return true
        if `?third` then return true
        false
    """
    rewrite = """
      def `?function`(`?firstArg`: `?firstType`, `?secondArg`: `?secondType`): Boolean =
        if `?first` then
          `?effect`
          true
        else `?second` || `?third`
    """
  }
  {
    name = "Final return"
    description = "A method's final expression is returned without the return keyword"
    pattern = """
      def `?function`(@mult `?args`: `?argTypes`): `?resultType` =
        `?before`: @mult
        return `?value`
    """
    rewrite = """
      def `?function`(@mult `?args`: `?argTypes`): `?resultType` =
        `?before`: @mult
        `?value`
    """
  }
  {
    name = "Combine equal Boolean branches"
    description = "Combine two tests that perform the same effect, preserving their short-circuit order"
    pattern = """
      if `?first` then
        `?effect`
        true
      else if `?second` then
        `?effect`
        true
      else false
    """
    rewrite = """
      if `?first` || `?second` then
        `?effect`
        true
      else false
    """
  }
  {
    name = "Identical if branches"
    description = "Evaluate the condition once, then run the common branch once"
    pattern = """if `?condition` then `?body` else `?body`"""
    rewrite = """{ `?condition`; `?body` }"""
  }
  {
    name = "Extract effect from Boolean if"
    description = "Compute the Boolean once, then effect only when it is true"
    pattern = """
      {
        `?before`: @mult
        val `?here` =
          if `?condition` then
            `?effect`
            true
          else false
        `?after`: @mult1
      }
    """
    rewrite = """
      {
        `?before`: @mult
        val `?here` = `?condition`
        if `?here` then `?effect`
        `?after`: @mult1
      }
    """
  }
  {
    name = "Decouple value and side-effect form nested ifs"
    description = "Compute the condition first, then perform the common side-effect"
    pattern = """
      {
        `?before`: @mult
        val `?here` =
          if `?outer` then
            if `?check1` then
              `?effect`
              true
            else false
          else if `?check2` then
            `?effect`
            true
          else false
        `?after`: @mult1
      }
    """
    rewrite = """
      {
        `?before`: @mult
        val `?here` = if `?outer` then `?check1` else `?check2`
        if `?here` then `?effect`
        `?after`: @mult1
      }
    """
  }
  {
    name = "Inline final val"
    description = "A val used only as the block's final expression can be replaced by its initializer"
    match-ascriptions = true
    pattern = """
      {
        `?before`: @mult
        val `?name` = `?value`
        `?name`
      }
    """
    rewrite = """
      {
        `?before`: @mult
        `?value`
      }
    """
  }
  # A false else branch can only be removed when the surrounding block proves
  # that the if's value is discarded. Put these contextual rules before the
  # expression-level Boolean observations.
  {
    name = "Unused if result"
    description = "The result of this non-final if is discarded; keep its effects and remove its literal Boolean results"
    pattern = """
      {
        `?before`: @mult
        if `?condition` then
          `?firstEffect`
          `?moreEffects`: @mult
          true
        else false
        `?after`: @mult1
      }
    """
    rewrite = """
      {
        `?before`: @mult
        if `?condition` then
          `?firstEffect`
          `?moreEffects`: @mult
        `?after`: @mult1
      }
    """
  }
  {
    name = "Unused else false"
    description = "The result of this non-final if is discarded, so its literal false else branch is unnecessary"
    pattern = """
      {
        `?before`: @mult
        if `?condition` then `?body` else false
        `?next`
        `?after`: @mult
      }
    """
    rewrite = """
      {
        `?before`: @mult
        if `?condition` then `?body`
        `?next`
        `?after`: @mult
      }
    """
  }

  # The two fully constant Boolean conditionals are safe in every context.
  {
    name = "if c then true else false"
    description = "if c then true else false  ==>  c"
    pattern = """if `?condition` then true else false"""
    rewrite = """`?condition`"""
  }
  {
    name = "if c then false else true"
    description = "if c then false else true  ==>  !c"
    pattern = """if `?condition` then false else true"""
    rewrite = """!`?condition`"""
  }
  {
    name = "if c then false else b"
    description = "A Boolean 'if c then false else e' can be simplified to '!c && e'"
    pattern = """if `?condition` then false else (`?expression`: Boolean)"""
    rewrite = """!`?condition` && `?expression`"""
  }
  {
    name = "if c then b else true"
    description = "A Boolean 'if c then e else true' can be simplified to '!c || e'"
    pattern = """if `?condition` then (`?expression`: Boolean) else true"""
    rewrite = """!`?condition` || `?expression`"""
  }
  {
    name = "if c then true else b"
    description = "A Boolean 'if c then true else e' can be simplified to 'c || e'"
    pattern = """if `?condition` then true else (`?expression`: Boolean)"""
    rewrite = """`?condition` || `?expression`"""
  }
  {
    name = "if c then b else false"
    description = "A Boolean 'if c then e else false' can be simplified to 'c && e'"
    pattern = """if `?condition` then (`?expression`: Boolean) else false"""
    rewrite = """`?condition` && `?expression`"""
  }
  {
    name = "Nested if guards"
    description = "Combine nested conditions that guard the same side effect"
    pattern = """
      if `?outer` then
        if `?inner` then
          `?body`
    """
    rewrite = """
      if `?outer` && `?inner` then
        `?body`
    """
  }
  # Boolean equality.
  {
    name = "b == true"
    description = "b == true  ==>  b"
    pattern = """(`?expression`: Boolean) == true"""
    rewrite = """`?expression`"""
  }
  {
    name = "true == b"
    description = "true == b  ==>  b"
    pattern = """true == (`?expression`: Boolean)"""
    rewrite = """`?expression`"""
  }
  {
    name = "b == false"
    description = "b == false  ==>  !b"
    pattern = """(`?expression`: Boolean) == false"""
    rewrite = """!`?expression`"""
  }
  {
    name = "false == b"
    description = "false == b  ==>  !b"
    pattern = """false == (`?expression`: Boolean)"""
    rewrite = """!`?expression`"""
  }
  {
    name = "b != false"
    description = "b != false  ==>  b"
    pattern = """(`?expression`: Boolean) != false"""
    rewrite = """`?expression`"""
  }
  {
    name = "false != b"
    description = "false != b  ==>  b"
    pattern = """false != (`?expression`: Boolean)"""
    rewrite = """`?expression`"""
  }
  {
    name = "b != true"
    description = "b != true  ==>  !b"
    pattern = """(`?expression`: Boolean) != true"""
    rewrite = """!`?expression`"""
  }
  {
    name = "true != b"
    description = "true != b  ==>  !b"
    pattern = """true != (`?expression`: Boolean)"""
    rewrite = """!`?expression`"""
  }
  {
    name = "!!b"
    description = "!!b  ==>  b"
    pattern = """!(!(`?expression`: Boolean))"""
    rewrite = """`?expression`"""
  }
  # Equality is safe to reverse for primitive numbers, unlike arbitrary
  # reference values whose equals implementations need not be symmetric.
  # TODO: Infer method-call result types such as entry.size(): Long before
  # extending these rules beyond expressions with known SemanticDB types.
  {
    name = "0 == Int"
    description = "Put the Int expression before the constant"
    pattern = """0 == (`?number`: Int)"""
    rewrite = """`?number` == 0"""
  }
  {
    name = "0 != Int"
    description = "Put the Int expression before the constant"
    pattern = """0 != (`?number`: Int)"""
    rewrite = """`?number` != 0"""
  }
  {
    name = "1 == Int"
    description = "Put the Int expression before the constant"
    pattern = """1 == (`?number`: Int)"""
    rewrite = """`?number` == 1"""
  }
  {
    name = "1 != Int"
    description = "Put the Int expression before the constant"
    pattern = """1 != (`?number`: Int)"""
    rewrite = """`?number` != 1"""
  }
  {
    name = "0 == Long"
    description = "Put the Long expression before the constant"
    pattern = """0 == (`?number`: Long)"""
    rewrite = """`?number` == 0"""
  }
  {
    name = "0 != Long"
    description = "Put the Long expression before the constant"
    pattern = """0 != (`?number`: Long)"""
    rewrite = """`?number` != 0"""
  }
  {
    name = "1 == Long"
    description = "Put the Long expression before the constant"
    pattern = """1 == (`?number`: Long)"""
    rewrite = """`?number` == 1"""
  }
  {
    name = "1 != Long"
    description = "Put the Long expression before the constant"
    pattern = """1 != (`?number`: Long)"""
    rewrite = """`?number` != 1"""
  }
  {
    name = "!(a == b)"
    description = "!(a == b)  ==>  a != b"
    pattern = """!(`?left` == `?right`)"""
    rewrite = """`?left` != `?right`"""
  }
  {
    name = "!(a != b)"
    description = "!(a != b)  ==>  a == b"
    pattern = """!(`?left` != `?right`)"""
    rewrite = """`?left` == `?right`"""
  }

  # Short-circuit Boolean operators. The two right-hand absorbing cases are
  # observations only because rewriting them would skip evaluation of b.
  {
    name = "true && b"
    description = "true && b  ==>  b"
    pattern = """true && (`?expression`: Boolean)"""
    rewrite = """`?expression`"""
  }
  {
    name = "false && b"
    description = "false && b  ==>  false"
    pattern = """false && (`?expression`: Boolean)"""
    rewrite = """false"""
  }
  {
    name = "b && true"
    description = "b && true  ==>  b"
    pattern = """(`?expression`: Boolean) && true"""
    rewrite = """`?expression`"""
  }
  {
    name = "b && false"
    description = "b && false is false, but b must be pure before its evaluation can be removed"
    pattern = """(`?expression`: Boolean) && false"""
  }
  {
    name = "false || b"
    description = "false || b  ==>  b"
    pattern = """false || (`?expression`: Boolean)"""
    rewrite = """`?expression`"""
  }
  {
    name = "true || b"
    description = "true || b  ==>  true"
    pattern = """true || (`?expression`: Boolean)"""
    rewrite = """true"""
  }
  {
    name = "b || false"
    description = "b || false  ==>  b"
    pattern = """(`?expression`: Boolean) || false"""
    rewrite = """`?expression`"""
  }
  {
    name = "b || true"
    description = "b || true is true, but b must be pure before its evaluation can be removed"
    pattern = """(`?expression`: Boolean) || true"""
  }

  # Strict Boolean operators. Identity rewrites retain the non-constant
  # operand's evaluation. Absorbing rewrites are lint-only because & and |
  # evaluate both operands.
  {
    name = "true & b"
    description = "true & b  ==>  b"
    pattern = """true & (`?expression`: Boolean)"""
    rewrite = """`?expression`"""
  }
  {
    name = "b & true"
    description = "b & true  ==>  b"
    pattern = """(`?expression`: Boolean) & true"""
    rewrite = """`?expression`"""
  }
  {
    name = "false & b"
    description = "false & b is false, but strict & still evaluates b"
    pattern = """false & (`?expression`: Boolean)"""
  }
  {
    name = "b & false"
    description = "b & false is false, but strict & still evaluates b"
    pattern = """(`?expression`: Boolean) & false"""
  }
  {
    name = "false | b"
    description = "false | b  ==>  b"
    pattern = """false | (`?expression`: Boolean)"""
    rewrite = """`?expression`"""
  }
  {
    name = "b | false"
    description = "b | false  ==>  b"
    pattern = """(`?expression`: Boolean) | false"""
    rewrite = """`?expression`"""
  }
  {
    name = "true | b"
    description = "true | b is true, but strict | still evaluates b"
    pattern = """true | (`?expression`: Boolean)"""
  }
  {
    name = "b | true"
    description = "b | true is true, but strict | still evaluates b"
    pattern = """(`?expression`: Boolean) | true"""
  }
  {
    name = "false ^ b"
    description = "false ^ b  ==>  b"
    pattern = """false ^ (`?expression`: Boolean)"""
    rewrite = """`?expression`"""
  }
  {
    name = "b ^ false"
    description = "b ^ false  ==>  b"
    pattern = """(`?expression`: Boolean) ^ false"""
    rewrite = """`?expression`"""
  }
  {
    name = "true ^ b"
    description = "true ^ b  ==>  !b"
    pattern = """true ^ (`?expression`: Boolean)"""
    rewrite = """!`?expression`"""
  }
  {
    name = "b ^ true"
    description = "b ^ true  ==>  !b"
    pattern = """(`?expression`: Boolean) ^ true"""
    rewrite = """!`?expression`"""
  }
  # Int identities used by the lab. Explicit Boolean/Int constraints prevent
  # these generic-looking rules from rewriting user-defined operators.
  {
    name = "n + 0"
    description = "n + 0  ==>  n"
    pattern = """(`?number`: Int) + 0"""
    rewrite = """`?number`"""
  }
  {
    name = "0 + n"
    description = "0 + n  ==>  n"
    pattern = """0 + (`?number`: Int)"""
    rewrite = """`?number`"""
  }
  {
    name = "n - 0"
    description = "n - 0  ==>  n"
    pattern = """(`?number`: Int) - 0"""
    rewrite = """`?number`"""
  }
  {
    name = "n * 1"
    description = "n * 1  ==>  n"
    pattern = """(`?number`: Int) * 1"""
    rewrite = """`?number`"""
  }
  {
    name = "1 * n"
    description = "1 * n  ==>  n"
    pattern = """1 * (`?number`: Int)"""
    rewrite = """`?number`"""
  }
  {
    name = "n / 1"
    description = "n / 1  ==>  n"
    pattern = """(`?number`: Int) / 1"""
    rewrite = """`?number`"""
  }
  {
    name = "+n"
    description = "+n  ==>  n"
    pattern = """+(`?number`: Int)"""
    rewrite = """`?number`"""
  }
  {
    name = "-(-n)"
    description = "-(-n)  ==>  n"
    pattern = """-(-(`?number`: Int))"""
    rewrite = """`?number`"""
  }

  # Find-lab observations and rewrites from find_notes.local.md.
  {
    name = "lazy val"
    description = "lazy val has not been introduced yet in this lab; use a regular val"
    pattern = """lazy val `?name` = `?initial`"""
  }
  {
    name = ".equals"
    description = "Prefer Scala's == when null-safe Scala equality is intended; this is not an automatic rewrite because null and numeric cases differ"
    pattern = """`?left`.equals(`?right`)"""
  }
  {
    name = "Inline one-argument helper"
    description = "This local recursive helper has the same one-parameter signature and is immediately called; use the outer function directly"
    pattern = """
      def `?outer`(`?outerArg`: `?argType`): `?resultType` =
        def `?helper`(`?helperArg`: `?argType`): `?resultType` =
          `?body`
        `?helper`(`?outerArg`)
    """
    rewrite = """
      def `?outer`(`?outerArg`: `?argType`): `?resultType` =
        `?body`(`?helper` --> `?outer`, `?helperArg` --> `?outerArg`)
    """
  }
  {
    name = "Inline two-argument helper"
    description = "This local recursive helper has the same two-parameter signature and is immediately called; use the outer function directly"
    pattern = """
      def `?outer`(`?outerArg1`: `?argType1`, `?outerArg2`: `?argType2`): `?resultType` =
        def `?helper`(`?helperArg1`: `?argType1`, `?helperArg2`: `?argType2`): `?resultType` =
          `?body`
        `?helper`(`?outerArg1`, `?outerArg2`)
    """
    rewrite = """
      def `?outer`(`?outerArg1`: `?argType1`, `?outerArg2`: `?argType2`): `?resultType` =
        `?body`(
          `?helper` --> `?outer`,
          `?helperArg1` --> `?outerArg1`,
          `?helperArg2` --> `?outerArg2`
        )
    """
  }
  {
    name = "Mutable var"
    description = "Use vals and recursion instead of mutable state"
    pattern = """var `?name` = `?initial`"""
  }
  {
    name = "Uninitialized var"
    description = "Use vals and recursion instead of mutable state"
    pattern = """var `?name`: `?`"""
  }
  {
    name = "return true"
    description = "An early return makes this recursive search harder to compose"
    pattern = """return true"""
  }
  {
    name = "while loop"
    description = "Use recursion for sibling traversal in this exercise"
    pattern = """
      while `?condition` do
        `?body`
    """
  }
  {
    name = "for loop"
    description = "Use direct structural recursion in this exercise"
    pattern = """
      for `?name` <- `?values` do
        `?body`
    """
  }
  {
    name = "Predicate-first helper"
    description = "This exercise asks for direct structural recursion before the later higher-order refactor"
    match-fqn = false
    pattern = """def `?function`(`?predicate`: `?entryType` => Boolean, `?entry`: `?entryType`): Boolean = `?body`"""
  }
  {
    name = "Entry-first helper"
    description = "This exercise asks for direct structural recursion before the later higher-order refactor"
    match-fqn = false
    pattern = """def `?function`(`?entry`: `?entryType`, `?predicate`: `?entryType` => Boolean): Boolean = `?body`"""
  }

  # Flatten singleton blocks only where the surrounding syntax is preserved.
  # A bare `{ expression }` rule is unsafe in call-argument and interpolation
  # contexts.
  {
    name = "Single-expression then block"
    description = "A singleton then block can be flattened"
    match-blocks = true
    pattern = """if `?condition` then { `?expression` }"""
    rewrite = """if `?condition` then `?expression`"""
  }
  {
    name = "Single-expression then block with else"
    description = "A singleton then block can be flattened without changing the else branch"
    match-blocks = true
    pattern = """if `?condition` then { `?expression` } else `?alternative`"""
    rewrite = """if `?condition` then `?expression` else `?alternative`"""
  }
  {
    name = "Single-expression else block"
    description = "A singleton else block can be flattened without changing the then branch"
    match-blocks = true
    pattern = """if `?condition` then `?alternative` else { `?expression` }"""
    rewrite = """if `?condition` then `?alternative` else `?expression`"""
  }
  {
    name = "Single-expression while block"
    description = "A singleton while body can be flattened"
    match-blocks = true
    pattern = """while `?condition` do { `?expression` }"""
    rewrite = """while `?condition` do `?expression`"""
  }
  {
    name = "Single-expression val block"
    description = "A singleton block on an untyped val's right-hand side can be flattened"
    match-ascriptions = true
    match-blocks = true
    pattern = """val `?name` = { `?expression` }"""
    rewrite = """val `?name` = `?expression`"""
  }
  {
    name = "Single-expression typed val block"
    description = "A singleton block on a typed val's right-hand side can be flattened"
    match-ascriptions = true
    match-blocks = true
    pattern = """val `?name`: `?type` = { `?expression` }"""
    rewrite = """val `?name`: `?type` = `?expression`"""
  }
]

token-rules = [
  {
    name = "Uppercase function"
    description = "Name functions with lowerCamelCase"
    target-kind = "function"
    pattern = "^[A-Z]"
  }
  {
    name = "Uppercase val"
    description = "Name vals with lowerCamelCase"
    target-kind = "value"
    pattern = "^[A-Z]"
  }
  {
    name = "Uppercase parameter"
    description = "Name parameters with lowerCamelCase"
    target-kind = "parameter"
    pattern = "^[A-Z]"
  }
  {
    name = "Higher-order call"
    description = "Higher-order functions have not been introduced yet in this lab"
    target-kind = "function-argument"
    pattern = ".*"
  }
  # ScalaMeta folds !true and !false to Boolean literals while parsing rule
  # patterns. Match the source tokens so plain true/false are never flagged.
  {
    name = "!true"
    description = "!true  ==>  false"
    pattern = "!true"
    rewrite = "false"
  }
  {
    name = "!false"
    description = "!false  ==>  true"
    pattern = "!false"
    rewrite = "true"
  }
  {
    name = "Line-ending semicolon"
    description = "Remove a redundant line-ending semicolon; same-line separators are kept"
    pattern = """;(?=[ \t]*(?://[^\r\n]*)?(?:\r?\n|$))"""
    rewrite = ""
  }
]
